# Secure College Student Service Request System
# NMAM Institute of Technology – MCA Academic Project
# ============================================================

# Application
spring.application.name=secure-service-request

# Server
server.port=8080

# ── H2 Database ──────────────────────────────────────────────
spring.datasource.url=jdbc:h2:mem:servicerequestdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ── JPA / Hibernate ─────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ── JWT Configuration ───────────────────────────────────────
# The secret MUST be overridden via environment variable in production:
#   JWT_SECRET=<base64-encoded-256-bit-key>
# Default below is for LOCAL DEVELOPMENT ONLY.
app.jwt.secret=${JWT_SECRET:dGhpc0lzQVNlY3VyZUtleUZvckRldk9ubHlEb05vdFVzZUluUHJvZHVjdGlvbg==}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# ── Rate Limiting ────────────────────────────────────────────
app.rate-limit.requests-per-minute=${RATE_LIMIT_RPM:30}

# ── Swagger / OpenAPI ────────────────────────────────────────
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ── Error handling ───────────────────────────────────────────
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
